<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الكاشير — كافيه ومطعم المساء</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#D9A76A',
                            600: '#C39153',
                        },
                        surface: {
                            800: '#1A1D24',
                            900: '#121417',
                        }
                    },
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-surface-900 text-slate-100 min-h-screen p-4 md:p-8 antialiased">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- الترويسة -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-500/10 border border-brand-500/20 text-brand-500 rounded-xl flex items-center justify-center">
                    <i data-lucide="coffee" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-100">كافيه ومطعم المساء — لوحة الكاشير</h1>
                    <p class="text-xs text-slate-400">إدارة الترتيب التنازلي والمناداة</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="exportCustomersCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                    <i data-lucide="download" class="w-3.5 h-3.5 text-brand-500"></i>
                    <span>تصدير الأرشيف (CSV)</span>
                </button>
                <button onclick="handleResetDay()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    <span>تصفير الطابور النشط</span>
                </button>
            </div>
        </header>

        <!-- الإحصائيات -->
        <section class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div class="bg-surface-800 border border-slate-800/80 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400">المنتظرون حالياً</p>
                    <p id="stat-waiting" class="text-3xl font-black text-brand-500 mt-1">0</p>
                </div>
                <div class="w-12 h-12 bg-brand-500/10 border border-brand-500/20 text-brand-500 rounded-xl flex items-center justify-center">
                    <i data-lucide="clock" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="bg-surface-800 border border-slate-800/80 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400">تم خدمتهم اليوم</p>
                    <p id="stat-served" class="text-3xl font-black text-emerald-400 mt-1">0</p>
                </div>
                <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center">
                    <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="bg-surface-800 border border-slate-800/80 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400">إجمالي مسجلي اليوم</p>
                    <p id="stat-total" class="text-3xl font-black text-slate-200 mt-1">0</p>
                </div>
                <div class="w-12 h-12 bg-slate-700/30 border border-slate-700/50 text-slate-300 rounded-xl flex items-center justify-center">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="bg-surface-800 border border-slate-800/80 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400">أرشيف العملاء الكلي</p>
                    <p id="stat-archive" class="text-3xl font-black text-blue-400 mt-1">0</p>
                </div>
                <div class="w-12 h-12 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded-xl flex items-center justify-center">
                    <i data-lucide="database" class="w-6 h-6"></i>
                </div>
            </div>
        </section>

        <!-- البحث والفلترة -->
        <section class="bg-surface-800 border border-slate-800/80 p-4 rounded-2xl flex flex-col sm:flex-row gap-3 justify-between items-center">
            <div class="relative w-full sm:w-80">
                <i data-lucide="search" class="w-4 h-4 absolute right-3.5 top-3.5 text-slate-500"></i>
                <input type="text" id="search-input" oninput="renderTable()" placeholder="ابحث باسم العميل أو رقم الجوال..."
                    class="w-full bg-surface-900 border border-slate-700/80 rounded-xl pr-10 pl-4 py-2 text-xs text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-brand-500 transition">
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-brand-500 text-surface-900 transition">الطابور النشط</button>
                <button onclick="setFilter('waiting')" id="filter-waiting" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-surface-900 text-slate-400 hover:text-white transition">في الانتظار</button>
                <button onclick="setFilter('called')" id="filter-called" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-surface-900 text-slate-400 hover:text-white transition">تمت المناداة</button>
                <button onclick="setFilter('served')" id="filter-served" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-surface-900 text-slate-400 hover:text-white transition">تمت الخدمة</button>
                <button onclick="setFilter('archive')" id="filter-archive" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600/20 text-blue-400 border border-blue-500/30 hover:bg-blue-600/30 transition flex items-center gap-1">
                    <i data-lucide="database" class="w-3.5 h-3.5"></i>
                    <span>سجل العملاء الكامل</span>
                </button>
            </div>
        </section>

        <!-- الجدول -->
        <section class="bg-surface-800 border border-slate-800/80 rounded-2xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right text-xs">
                    <thead>
                        <tr class="bg-surface-900/60 text-slate-400 border-b border-slate-800">
                            <th class="py-3.5 px-4 font-semibold">ترتيب الانتظار</th>
                            <th class="py-3.5 px-4 font-semibold">رقم الحجز</th>
                            <th class="py-3.5 px-4 font-semibold">اسم العميل</th>
                            <th class="py-3.5 px-4 font-semibold">رقم الجوال</th>
                            <th class="py-3.5 px-4 font-semibold">الأفراد</th>
                            <th class="py-3.5 px-4 font-semibold">الحالة</th>
                            <th class="py-3.5 px-4 font-semibold text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="queue-tbody" class="divide-y divide-slate-800/60 font-medium">
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script>
        const SYNC_CHANNEL_KEY = 'dorak_system_channel';
        const STORAGE_QUEUE_KEY = 'dorak_queue_data';
        const STORAGE_ARCHIVE_KEY = 'dorak_all_customers_history';
        const channel = new BroadcastChannel(SYNC_CHANNEL_KEY);

        let activeFilter = 'all';

        lucide.createIcons();

        function renderTable() {
            const queueList = getStoredQueue();
            const archiveList = getStoredArchive();
            const tbody = document.getElementById('queue-tbody');
            const searchVal = document.getElementById('search-input').value.trim().toLowerCase();

            const waitingCount = queueList.filter(q => q.status === 'waiting' || q.status === 'called').length;
            const servedCount = queueList.filter(q => q.status === 'served').length;
            
            document.getElementById('stat-waiting').textContent = waitingCount;
            document.getElementById('stat-served').textContent = servedCount;
            document.getElementById('stat-total').textContent = queueList.length;
            document.getElementById('stat-archive').textContent = archiveList.length;

            let sourceList = (activeFilter === 'archive') ? archiveList : queueList;

            let filtered = sourceList.filter(q => {
                const matchesFilter = (activeFilter === 'all' || activeFilter === 'archive') || (q.status === activeFilter);
                const matchesSearch = (q.name && q.name.toLowerCase().includes(searchVal)) ||
                                      (q.phone && q.phone.includes(searchVal)) ||
                                      String(q.ticketNum).includes(searchVal);
                return matchesFilter && matchesSearch;
            });

            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="py-12 text-center text-slate-500 font-medium">
                            <div class="flex flex-col items-center gap-2">
                                <i data-lucide="inbox" class="w-8 h-8 opacity-40"></i>
                                <span>لا توجد بيانات مطابقة</span>
                            </div>
                        </td>
                    </tr>
                `;
                lucide.createIcons();
                return;
            }

            // تصفية المنتظرين فقط لحساب تسلسل الترتيب التنازلي المباشر
            const waitingOnly = queueList.filter(q => q.status === 'waiting');

            filtered.forEach(q => {
                // حساب الترتيب المباشر الحالي
                const currentRank = waitingOnly.findIndex(w => w.id === q.id) + 1;
                
                let rankBadge = '-';
                if (q.status === 'waiting') {
                    rankBadge = `<span class="text-brand-500 font-black text-sm">#${currentRank} في الطابور</span>`;
                } else if (q.status === 'called') {
                    rankBadge = `<span class="text-emerald-400 font-bold">دور الجاهزية الآن</span>`;
                }

                let statusTag = '';
                if (q.status === 'waiting') {
                    statusTag = `<span class="bg-brand-500/10 text-brand-500 border border-brand-500/20 px-2.5 py-1 rounded-full text-[11px] font-semibold">في الانتظار</span>`;
                } else if (q.status === 'called') {
                    statusTag = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full text-[11px] font-semibold animate-pulse">تمت المناداة</span>`;
                } else if (q.status === 'served') {
                    statusTag = `<span class="bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full text-[11px] font-semibold">تمت الخدمة</span>`;
                } else if (q.status === 'cancelled') {
                    statusTag = `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-full text-[11px] font-semibold">ملغى</span>`;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-surface-900/40 transition">
                        <td class="py-3.5 px-4">${rankBadge}</td>
                        <td class="py-3.5 px-4 font-mono text-slate-400">#${q.ticketNum}</td>
                        <td class="py-3.5 px-4 text-slate-100 font-semibold">${q.name}</td>
                        <td class="py-3.5 px-4 text-slate-400 font-mono dir-ltr text-right">${q.phone}</td>
                        <td class="py-3.5 px-4 text-slate-300 font-semibold">${q.guests} أفراد</td>
                        <td class="py-3.5 px-4">${statusTag}</td>
                        <td class="py-3.5 px-4 text-center">
                            <div class="flex items-center justify-center gap-2">
                                ${activeFilter !== 'archive' && q.status === 'waiting' ? `
                                    <button onclick="changeStatus('${q.id}', 'called')" class="bg-emerald-500 hover:bg-emerald-600 text-surface-900 font-bold px-3 py-1.5 rounded-lg text-[11px] transition flex items-center gap-1">
                                        <i data-lucide="bell" class="w-3.5 h-3.5"></i>
                                        <span>إرسال تنبيه المناداة 🔔</span>
                                    </button>
                                ` : ''}
                                ${activeFilter !== 'archive' && q.status === 'called' ? `
                                    <button onclick="changeStatus('${q.id}', 'served')" class="bg-brand-500 hover:bg-brand-600 text-surface-900 font-bold px-3 py-1.5 rounded-lg text-[11px] transition flex items-center gap-1">
                                        <i data-lucide="check" class="w-3.5 h-3.5"></i>
                                        <span>تأكيد الدخول والاستلام</span>
                                    </button>
                                ` : ''}
                                ${activeFilter !== 'archive' ? `
                                    <button onclick="handleDeleteCustomer('${q.id}')" class="bg-slate-700/40 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 border border-slate-700/50 px-2.5 py-1.5 rounded-lg text-[11px] transition" title="إلغاء وأرشفة">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                ` : `
                                    <span class="text-[11px] text-slate-500">محفوظ بالأرشيف</span>
                                `}
                            </div>
                        </td>
                    </tr>
                `;
            });

            lucide.createIcons();
        }

        function changeStatus(id, newStatus) {
            let queueList = getStoredQueue();
            queueList = queueList.map(q => q.id === id ? { ...q, status: newStatus } : q);
            saveStoredQueue(queueList);
            
            saveToGlobalArchive(queueList.find(q => q.id === id));

            broadcastSync();
            renderTable();
        }

        function handleDeleteCustomer(id) {
            if (!confirm('إزالة العميل من القائمة النشطة؟')) return;
            let queueList = getStoredQueue();
            const target = queueList.find(q => q.id === id);
            
            if (target) {
                target.status = 'cancelled';
                saveToGlobalArchive(target);
            }

            queueList = queueList.filter(q => q.id !== id);
            saveStoredQueue(queueList);
            broadcastSync();
            renderTable();
        }

        function handleResetDay() {
            if (!confirm('تصفير الطابور النشط؟')) return;
            saveStoredQueue([]);
            broadcastSync();
            renderTable();
        }

        function saveToGlobalArchive(customerObj) {
            if (!customerObj) return;
            let archiveList = getStoredArchive();
            const index = archiveList.findIndex(a => a.id === customerObj.id);
            
            if (index >= 0) {
                archiveList[index] = customerObj;
            } else {
                archiveList.unshift(customerObj);
            }
            localStorage.setItem(STORAGE_ARCHIVE_KEY, JSON.stringify(archiveList));
        }

        function exportCustomersCSV() {
            const archiveList = getStoredArchive();
            if (archiveList.length === 0) {
                alert('لا توجد بيانات عملاء في الأرشيف لتصديرها.');
                return;
            }

            let csvContent = "\uFEFFالاسم,رقم الجوال,عدد الأفراد,رقم الدور,التاريخ والوقت,الحالة\n";
            archiveList.forEach(c => {
                const dateStr = new Date(c.createdAt).toLocaleString('ar-SA');
                csvContent += `"${c.name}","${c.phone}","${c.guests}","${c.ticketNum}","${dateStr}","${c.status}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `سجل_عملاء_دورك_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function setFilter(filterType) {
            activeFilter = filterType;
            ['all', 'waiting', 'called', 'served', 'archive'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (btn) {
                    if (f === filterType) {
                        btn.className = (f === 'archive') 
                            ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition flex items-center gap-1' 
                            : 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-brand-500 text-surface-900 transition';
                    } else {
                        btn.className = (f === 'archive')
                            ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600/20 text-blue-400 border border-blue-500/30 hover:bg-blue-600/30 transition flex items-center gap-1'
                            : 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-surface-900 text-slate-400 hover:text-white transition';
                    }
                }
            });
            renderTable();
        }

        function getStoredQueue() {
            return JSON.parse(localStorage.getItem(STORAGE_QUEUE_KEY)) || [];
        }

        function saveStoredQueue(data) {
            localStorage.setItem(STORAGE_QUEUE_KEY, JSON.stringify(data));
        }

        function getStoredArchive() {
            return JSON.parse(localStorage.getItem(STORAGE_ARCHIVE_KEY)) || [];
        }

        function broadcastSync() {
            channel.postMessage({ type: 'SYNC_EVENT', timestamp: Date.now() });
        }

        channel.onmessage = (e) => {
            if (e.data.type === 'SYNC_EVENT') {
                const queueList = getStoredQueue();
                queueList.forEach(q => saveToGlobalArchive(q));
                renderTable();
            }
        };

        window.addEventListener('storage', () => {
            renderTable();
        });

        renderTable();
    </script>
</body>
</html>
